name: Deploy Laravel Backend to Rumahweb Hosting

on:
  push:
    branches:
      - main
      - backend

jobs:
  web-deploy:
    name: Deploy Laravel to Rumahweb FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd

      - name: 📦 Check or Build vendor.zip
        run: |
          if [ -d "backend_laravel" ]; then
            cd backend_laravel
          fi
          chmod +x build_vendor.sh
          ./build_vendor.sh

      - name: 📂 Prepare Production Environment (.env)
        run: |
          if [ -d "backend_laravel" ]; then
            cd backend_laravel
          fi
          if [ -f ".env.production" ]; then
            cp .env.production .env
          fi

      - name: 🚀 Sync Files via LFTP to Rumahweb
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || '202.10.43.74' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'synf6654' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'CgsMHqwKHC9M21' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          
          TARGET_DIR="./"
          if [ -d "backend_laravel" ]; then
            TARGET_DIR="backend_laravel/"
          fi
          
          lftp -c "
            set dns:order \"inet inet6\";
            set ftp:passive-mode true;
            set ftp:ssl-allow false;
            set net:timeout 15;
            set net:max-retries 3;
            open -u $FTP_USERNAME,$FTP_PASSWORD -p $FTP_PORT $FTP_SERVER;
            mirror --reverse --delete --verbose --exclude .git/ --exclude .github/ --exclude node_modules/ --exclude tests/ --exclude .env.example --exclude build_vendor.ps1 \$TARGET_DIR /public_html/;
          "

      - name: ⚡ Trigger Server Unzip & Optimization Webhook
        run: |
          curl -s "http://synectra.xyz/deploy_helper.php?token=ootday_deploy_secret_2026&migrate=true"
