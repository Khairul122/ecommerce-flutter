name: Deploy Laravel Backend to Rumahweb Hosting

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy Laravel to Rumahweb FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd

      - name: 📦 Build vendor.zip
        run: |
          if [ -d "backend_laravel" ]; then
            cd backend_laravel
          fi
          chmod +x build_vendor.sh || true
          ./build_vendor.sh

      - name: 📂 Prepare Production Environment (.env)
        run: |
          if [ -d "backend_laravel" ]; then
            cd backend_laravel
          fi
          if [ -f ".env.production" ]; then
            cp .env.production .env
          fi

      - name: 🚀 FTP Deploy to Rumahweb Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '202.10.43.74' }}
          username: ${{ secrets.FTP_USERNAME || 'synf6654' }}
          password: ${{ secrets.FTP_PASSWORD || 'CgsMHqwKHC9M21' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./backend_laravel/
          server-dir: /public_html/backend-ecommerce/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/.env.example

      - name: ⚡ Trigger Server Unzip, Migration & Seeding Webhook
        run: |
          curl -s "http://synectra.xyz/backend-ecommerce/public/deploy_helper.php?token=ootday_deploy_secret_2026&migrate=true&seed=true"
